name: Sync a nasazení

on:
  schedule:
    # Záloha pro dny, kdy neběží lokální sync z Macu (scripts/local-sync.sh). GitHub tyhle běhy
    # spouští se zpožděním i několika hodin. UTC, v zimě 6:07, 10:07, 14:07 a 18:07 pražského času.
    - cron: '7 5 * * *' # včetně AI dohledání, pokud ten den ještě neproběhlo
    - cron: '7 9,13,17 * * *'
  workflow_dispatch:
    inputs:
      ai:
        description: Spustit i AI dohledání (Claude API)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Větev místo SHA spouštěče: běh čekající ve frontě jinak nevidí data z předchozího běhu a push selže.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Push jen s daty (commit „data: …“ z lokálního syncu) se už znovu nesynchronizuje, jen nasadí.
      - name: Sync akcí
        if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'data:') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_AI: ${{ (github.event.schedule == '7 5 * * *' || inputs.ai == true) && '1' || '0' }}
        run: node scripts/sync.mjs

      - name: Uložit data do repozitáře
        if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'data:') }}
        run: |
          git config user.name "meetupradar-bot"
          git config user.email "meetupradar-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "data: sync $(date -u +%FT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
